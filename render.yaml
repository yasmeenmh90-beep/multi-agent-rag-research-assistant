databases:
  - name: rag-db
    plan: free
    databaseName: rag_dashboard
    user: rag_dashboard

services:
  # FastAPI backend: runs the LangGraph agent pipeline, holds the Chroma
  # vector index. Django never talks to OpenAI or Chroma directly - it only
  # proxies to this service over Render's private network.
  - type: web
    name: rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /docs
    # Upgraded from free (512MB RAM) to pro for real headroom - the free
    # tier is what forced ENABLE_RERANKER off and the conservative upload
    # cap in the first place.
    disk:
      name: rag-api-storage
      mountPath: /app/storage
      sizeGB: 10
    # Without this disk, chroma_db/ (never committed to git) and any
    # newly-uploaded/literature-review-fetched documents would reset to
    # the image's baked-in corpus on every restart or redeploy. Chroma's
    # index and the live documents dir both live on this disk now, so
    # they survive restarts; app/main.py seeds+ingests from the image's
    # baked-in corpus into this disk automatically the first time it's
    # empty (see _seed_and_ingest_if_needed), then never repeats that
    # work on later boots.
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      # Off by default: the cross-encoder reranker needs sentence-transformers
      # + torch, which alone can exceed the free tier's 512MB RAM. Flip to
      # "true" once rag-api is upgraded to an instance with more headroom.
      - key: ENABLE_RERANKER
        value: "false"
      # Was capped down for the free tier's 512MB RAM ceiling - now on Pro,
      # this matches local dev's own default (2048MB/2GB) exactly.
      - key: MAX_UPLOAD_FILE_SIZE_MB
        value: "2048"
      - key: CHROMA_PERSIST_DIR
        value: /app/storage/chroma_db
      - key: DOCUMENTS_DIR
        value: /app/storage/documents

  # Django dashboard: chat UI, history, corpus browser, upload, and the
  # stats dashboard. Talks to rag-api over Render's private network.
  - type: web
    name: rag-dashboard
    runtime: python
    plan: starter
    buildCommand: >-
      pip install -r django_dashboard/requirements.txt &&
      python django_dashboard/manage.py collectstatic --noinput &&
      python django_dashboard/manage.py migrate
    startCommand: gunicorn dashboard.wsgi:application --chdir django_dashboard
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Render defaults to a very new Python (3.14 as of writing) that
      # psycopg2-binary 2.9.9 has no precompiled wheel for yet - pinning to
      # 3.12 avoids the "Error loading psycopg2 or psycopg2 module" crash.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Render gives every web service a private address of
      # http://<service-name>:<port> reachable from other services in the
      # same account/region - rag-api listens on 8000 per the Dockerfile.
      # If this doesn't resolve after deploy, check rag-api's service page
      # for its actual internal address and override manually here.
      - key: FASTAPI_BASE_URL
        value: https://rag-api-7kfa.onrender.com
      # Must match rag-api's MAX_UPLOAD_FILE_SIZE_MB - Django checks and
      # rejects oversized files itself before ever forwarding to rag-api,
      # so if these two values drift apart, Django would accept a file
      # that FastAPI then rejects anyway, after wasting the transfer.
      - key: MAX_UPLOAD_FILE_SIZE_MB
        value: "2048"
      - key: DATABASE_URL
        fromDatabase:
          name: rag-db
          property: connectionString
