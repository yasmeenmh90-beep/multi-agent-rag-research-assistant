databases:
  - name: rag-db
    plan: free
    databaseName: rag_dashboard
    user: rag_dashboard

services:
  # FastAPI backend: runs the LangGraph agent pipeline, holds the Chroma
  # vector index. Django never talks to OpenAI or Chroma directly - it only
  # proxies to this service over Render's private network.
  - type: web
    name: rag-api-7kfa
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /docs
    # Standard (2GB RAM, 1 CPU, ~$25/mo) - enough headroom to safely run
    # the cross-encoder reranker for a stronger demo, without Pro's ~$85/mo
    # cost. Suspend or delete this service after judging/submission ends
    # to stop billing - Render bills per-second while a service is active.
    disk:
      name: rag-api-storage
      mountPath: /app/storage
      sizeGB: 10
    # Without this disk, chroma_db/ (never committed to git) and any
    # newly-uploaded/literature-review-fetched documents would reset to
    # the image's baked-in corpus on every restart or redeploy. Chroma's
    # index and the live documents dir both live on this disk now, so
    # they survive restarts; app/main.py seeds+ingests from the image's
    # baked-in corpus into this disk automatically the first time it's
    # empty (see _seed_and_ingest_if_needed), then never repeats that
    # work on later boots.
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      # Safe to enable on Standard's 2GB - the cross-encoder model
      # (~90MB, plus sentence-transformers/torch overhead) fits
      # comfortably now, unlike on a 512MB Starter/free instance.
      - key: ENABLE_RERANKER
        value: "true"
      # Raised from 150 (conservative for 512MB) - still well under the
      # full 2GB RAM, since the file gets copied through memory more than
      # once during the Django-to-FastAPI proxy step. Both Django and
      # FastAPI must agree on this value (see rag-dashboard below).
      - key: MAX_UPLOAD_FILE_SIZE_MB
        value: "500"
      - key: CHROMA_PERSIST_DIR
        value: /app/storage/chroma_db
      - key: DOCUMENTS_DIR
        value: /app/storage/documents

  # Django dashboard: chat UI, history, corpus browser, upload, and the
  # stats dashboard. Talks to rag-api over Render's private network.
  - type: web
    name: rag-dashboard
    runtime: python
    plan: free
    # Just serves the UI and proxies to rag-api - no ML dependencies, no
    # heavy memory needs, so this stays on free while rag-api (which does
    # the actual embedding/retrieval work) gets the paid Starter tier.
    buildCommand: >-
      pip install -r django_dashboard/requirements.txt &&
      python django_dashboard/manage.py collectstatic --noinput &&
      python django_dashboard/manage.py migrate
    startCommand: gunicorn dashboard.wsgi:application --chdir django_dashboard --timeout 600
    # Default gunicorn worker timeout is 30s - far too short for the
    # Literature Review view, which proxies to FastAPI and waits (up to
    # 600s, matching the requests.post timeout in views.py) while it
    # searches, downloads, and synthesizes. Without this flag, gunicorn
    # kills the worker as "unresponsive" long before that legitimate work
    # finishes, producing a 500 error mid-request.
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Render defaults to a very new Python (3.14 as of writing) that
      # psycopg2-binary 2.9.9 has no precompiled wheel for yet - pinning to
      # 3.12 avoids the "Error loading psycopg2 or psycopg2 module" crash.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Render gives every web service a private address of
      # http://<service-name>:<port> reachable from other services in the
      # same account/region - rag-api listens on 8000 per the Dockerfile.
      # If this doesn't resolve after deploy, check rag-api's service page
      # for its actual internal address and override manually here.
      - key: FASTAPI_BASE_URL
        value: http://rag-api:8000
      # Must match rag-api's MAX_UPLOAD_FILE_SIZE_MB - Django checks and
      # rejects oversized files itself before ever forwarding to rag-api,
      # so if these two values drift apart, Django would accept a file
      # that FastAPI then rejects anyway, after wasting the transfer.
      - key: MAX_UPLOAD_FILE_SIZE_MB
        value: "500"
      - key: DATABASE_URL
        fromDatabase:
          name: rag-db
          property: connectionString
