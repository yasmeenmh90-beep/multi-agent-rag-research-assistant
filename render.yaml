databases:
  - name: rag-db
    plan: free
    databaseName: rag_dashboard
    user: rag_dashboard

services:
  - type: web
    name: rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /docs
    disk:
      name: rag-chroma-data
      mountPath: /app/chroma_db
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: rag-dashboard
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r django_dashboard/requirements.txt &&
      python django_dashboard/manage.py collectstatic --noinput &&
      python django_dashboard/manage.py migrate
    startCommand: gunicorn dashboard.wsgi:application --chdir django_dashboard
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FASTAPI_BASE_URL
        value: http://rag-api:8000
      - key: DATABASE_URL
        fromDatabase:
          name: rag-db
          property: connectionString
